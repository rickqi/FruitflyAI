  colored:(pathGeo.getAttribute('color')?pathGeo.attributes.color.count:0),

  let mnx=1e18,mxx=-1e18,mnz=1e18,mxz=-1e18;
  for(const p of pts){if(p.x<mnx)mnx=p.x;if(p.x>mxx)mxx=p.x;if(p.z<mnz)mnz=p.z;if(p.z>mxz)mxz=p.z;}
  const diag=Math.hypot(mxx-mnx, mxz-mnz);
  // iterative threshold: guarantee ≤ ~3000 kept points so the Chaikin pass
  // (×2-1) stays inside the 6000-point GPU buffer (no tail truncation)
  let thr=Math.max(10, diag*0.004), keep=[];
  for(let iter=0;iter<6;iter++){
    keep=[pts[0]];
    let lx=pts[0].x,ly=pts[0].y,lz=pts[0].z;
    for(let i=1;i<n-1;i++){const p=pts[i];
      if(Math.hypot(p.x-lx,p.y-ly,p.z-lz)>=thr){keep.push(p);lx=p.x;ly=p.y;lz=p.z;}}
    keep.push(pts[n-1]);
    if(keep.length<=3000)break;
    thr*=1.6;
  }
  if(keep.length<3)return keep;
  const sm=[keep[0]];
  for(let i=0;i<keep.length-1;i++){const a=keep[i],b=keep[i+1];
    sm.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25,z:a.z*.75+b.z*.25,t:(a.t||0)*.75+(b.t||0)*.25},
            {x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75,z:a.z*.25+b.z*.75,t:(a.t||0)*.25+(b.t||0)*.75});}
  sm.push(keep[keep.length-1]);
  return sm;
}
function pushPts(){
  const n=Math.min(pts.length,MAXP);
  let ymin=Infinity,ymax=-Infinity;
  for(let i=0;i<n;i++){const y=pts[i].y;if(y<ymin)ymin=y;if(y>ymax)ymax=y;}
  if(!isFinite(ymin)){ymin=0;ymax=0;}
  heightRange={min:ymin,max:ymax};
  const span=Math.max(1e-6,ymax-ymin);
  // 低段亮度下限：t→0 的深蓝与页面背景 (#0b1015) 几乎同色，起飞段不可见。
  // 等比抬升使最亮通道 ≥0.5 —— 色相不变，只加亮度。
  const lift=rgb=>{const mx=Math.max(rgb[0],rgb[1],rgb[2],1e-3);const k=Math.max(1,0.5/mx);
    return [Math.min(1,rgb[0]*k),Math.min(1,rgb[1]*k),Math.min(1,rgb[2]*k)];};
  // memory-map plane: flat base under the whole path — carpet, topology edges
  // and memory dots all sit here, so the grid aligns horizontally with the
  // trajectory footprint exactly (the old per-tile nearest-y scatter is gone).
  mapY=(pts.length?ymin:120)-12;
  const colAttr=pathGeo.attributes.color;
  // ── raw detail layer (thin, faint): every telemetry point ──
  for(let i=0;i<n;i++){
    pathArr[i*3]=pts[i].x;pathArr[i*3+1]=pts[i].y;pathArr[i*3+2]=pts[i].z;
    const rgb=lift(heightColor((pts[i].y-ymin)/span));
    pathColArr[i*3]=rgb[0];pathColArr[i*3+1]=rgb[1];pathColArr[i*3+2]=rgb[2];
  }
  pathGeo.attributes.position.needsUpdate=true;
  colAttr.needsUpdate=true;
  pathGeo.setDrawRange(0,n);
  // ── main smoothed layer (Line2, 2.5px) ──
  const sm=smoothPts();
  const flat=[],cols=[];
  for(const p of sm){
    flat.push(p.x,p.y,p.z);
    const rgb=lift(heightColor((p.y-ymin)/span));
    cols.push(rgb[0],rgb[1],rgb[2]);
  }
  if(sm.length>=2){mainGeo.setPositions(flat);mainGeo.setColors(cols);}
  // jump 金点：jump=true 的帧（仅 Live 源带 jump 字段；npz 存档未存）
  let jn=0;
  for(let i=0;i<n;i++) if(pts[i].jump) jn++;
  if(jn){ const ja=new Array(jn*3); let j=0;
    for(let i=0;i<n;i++){ const p=pts[i]; if(p.jump){
      ja[j*3]=p.x; ja[j*3+1]=p.y+15; ja[j*3+2]=p.z; j++; } }
    jumpGeo.setAttribute('position',new THREE.Float32BufferAttribute(ja,3));
  }
  jumpDots.visible=jn>0;
  // vertical drop-lines: every Nth point → memory-map plane
  const seg=verticalSegmentCount(n),step=verticalStep(n);
  let v=0;
  for(let i=0;i<n&&v<seg;i+=step){
    const p=pts[i];
    vertArr[v*6]=p.x;vertArr[v*6+1]=p.y;vertArr[v*6+2]=p.z;
    vertArr[v*6+3]=p.x;vertArr[v*6+4]=mapY;vertArr[v*6+5]=p.z;
    v++;
  }
  vertGeo.attributes.position.needsUpdate=true;
  vertGeo.setDrawRange(0,v*2);
  vertLines.visible=v>0;
  extendCum();
}

function loadTrajectory(data, head){
  // head=true → live follow (cursor rides the newest point)
  pts=data;
  if(!pts||!pts.length){
    if(head){$('frameInfo').textContent='waiting for points…';return;}  // live: not an error, points not sampled yet
    $('errorMsg').textContent='Empty trajectory';$('errorMsg').style.display='block';return;}
  $('errorMsg').style.display='none';
  pos = head ? pts.length-1 : 0;
  // t22 #3: keep the ground grid on the trajectory's own base height
  grid.position.y=autoGroundY(pts);
  $('slider').max=pts.length-1;
  if(pts.length<2){pushPts();update();return;}
  cum=[0];pushPts();
  sL.position.set(pts[0].x,pts[0].y+200,pts[0].z);
  eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
  fitView();update();
}

async function loadList(){
  try{const r=await fetch('/trajectory-list.json');if(!r.ok)throw Error('HTTP '+r.status);
    const list=await r.json();
    let html='<option value="__live__" selected>🟢 Live (current session · auto-refresh)</option>';
    if(list.length)html+=list.map(f=>'<option value="'+f.name+'">'+f.name.replace(/\.trajectory\.npz$/,'').slice(-30)+' ('+(f.size/1024|0)+'KB)</option>').join('');
    sel.innerHTML=html;
    loadFile('__live__');}catch(e){sel.innerHTML='<option>Error loading list</option>';$('errorMsg').textContent='List error: '+e.message;$('errorMsg').style.display='block';}
}

async function loadFile(name){
  try{
    let data;
    if(name==='__live__'){const r=await fetch('/trajectory.json');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      follow=true;   // re-selecting Live restores head-follow
      await refreshMemoryOverlay(data);
      loadTrajectory(data, true);
      setLive(true);
      $('frameInfo').textContent = (pts.length? pos+'/'+(pts.length-1) : 'waiting for points…');
    }
    else{setLive(false);const r=await fetch('/trajectory-load?file='+encodeURIComponent(name));if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      memDots.visible=false;carpet.visible=false;adjLines.visible=false;$('memInfo').textContent='';
      loadTrajectory(data, false);}
  }catch(e){$('errorMsg').textContent='Load error: '+e.message;$('errorMsg').style.display='block';}
}

// ── Live polling: every 2 s fetch /trajectory.json and MERGE only the new
// points (matched by t) into the existing buffer — the line grows instead of
// being reloaded, and playback is never interrupted.  The cursor follows the
// newest point only while it is already at/near the end (manual scrub wins).
let liveTimer=null;
function setLive(on){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  $('liveDot').textContent = on ? '🟢 LIVE' : '📄 REPLAY';
  if(on) liveTimer=setInterval(refreshLive, 2000);
}
async function refreshLive(){
  if(sel.value!=='__live__') return;          // replaying a saved file
  try{
    const r=await fetch('/trajectory.json'); if(!r.ok) return;
    const d=await r.json();
    if(!d||!d.length){$('frameInfo').textContent='waiting for points…';return;}
    await refreshMemoryOverlay(d);
    const lastT = pts.length ? pts[pts.length-1].t : -1;
    const fresh = d.filter(p=>p.t>lastT);
    if(!fresh.length) return;                 // nothing new since last poll
    pts = pts.concat(fresh).slice(-6000);   // match backend retention (whole session)
    pushPts();
    eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
    $('slider').max=pts.length-1;
    if(follow) pos=pts.length-1;   // ride the head ONLY in follow mode
    update();
  }catch(_){/* transient network blip — keep last good frame */}
}
async function refreshMemoryOverlay(traj){
  console.log('[fly64] refreshMemoryOverlay called, traj.len='+(traj?traj.length:'null')+' points');
  try{const m=await fetch('/memory.json');if(!m.ok)return;const mem=await m.json();
    console.log('[fly64] memory.json loaded, heat_cells='+(Array.isArray(mem.heat_cells)?mem.heat_cells.length:'none'));
    // The memory grid is a TOP-DOWN occupancy map: carpet tiles, adjacency
    // edges and memory dots all sit on ONE flat plane (mapY) directly under
    // the trajectory footprint — horizontal (x,z) alignment with the path is
    // exact; height is conveyed by the path line + drop-lines instead.
    const my=mapY;
    // ── Carpet: elevation-coloured tiles (height gradient matching the
    // path), with recency controlling luminance.  Tiles above the median
    // elevation glow warm (→red) — tiles below glow cool (→blue).  This
    // adds a height/depth dimension to the flat memory grid.
    const cs = 200;   // cell size, must match memory.py
    const cellH = {}; // per-cell mean height from the trajectory
    for (const p of traj) {
      const k = Math.floor(p.x / cs).toFixed(0) + ',' + Math.floor(p.z / cs).toFixed(0);
      (cellH[k] = cellH[k] || []).push(p.y);
    }
    const hMin = heightRange.min, hSpan = Math.max(heightRange.max - hMin, 1e-6);
    if (Array.isArray(mem.heat_cells) && mem.heat_cells.length) {
      const n = Math.min(mem.heat_cells.length, 2600);
      const ky = (x,z) => Math.floor(x/cs).toFixed(0) + ',' + Math.floor(z/cs).toFixed(0);
      for (let i = 0; i < n; i++) {
        const c = mem.heat_cells[i];
        _m4.makeTranslation(c[0], my, c[1]);
        carpet.setMatrixAt(i, _m4);
        // elevation colour from per-cell mean height
        const h0 = cellH[ky(c[0], c[1])];
        const cy = h0 ? h0.reduce((s,v)=>s+v,0)/h0.length : (hMin + hSpan * 0.5);
        const rgb = heightColor((cy - hMin) / hSpan);
        const lum = 0.35 + Math.min(c[2], 1) * 0.65;  // recency → brightness
        _c3.set(rgb[0] * lum, rgb[1] * lum, rgb[2] * lum);
        carpet.setColorAt(i, _c3);
      }
      carpet.count = n; carpet.instanceMatrix.needsUpdate = true;
      if (carpet.instanceColor) carpet.instanceColor.needsUpdate = true;
      carpet.visible = gridOn;
    }
    if(Array.isArray(mem.adjacency)&&mem.adjacency.length){
      const flat=[];
      for(const e of mem.adjacency){flat.push(e[0],my+4,e[1],e[2],my+4,e[3]);}
      adjGeo.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
      adjLines.visible=gridOn;
    }
    if(Array.isArray(mem.recent_path)&&mem.recent_path.length){
      memGeo.setAttribute('position',new THREE.Float32BufferAttribute(
        mem.recent_path.flatMap(c=>[c.x,my+7,c.z]),3));
      memDots.visible=true;
      const tot=mem.total_cells, shown=mem.heat_cells?mem.heat_cells.length:0;
      const trunc=(tot&&shown&&tot>shown)?` (显示 ${shown}/${tot})`:'';
      $('memInfo').textContent='🧠 memory: '+mem.recent_path.length+' path cells · '
        +(mem.adjacency_edges??'?')+' edges · '+shown+' grid tiles'+trunc
        +' · noveltyDir '+(mem.cx_novelty_direction??'—');
    }
    // P0 display: navigation-decision arrows at the agent's current position.
    // Cyan=frontier attraction, orange=visited repulsion, red=plateau breakout.
    try{
      const nd=mem.nav_debug;
      const head=traj.length?traj[traj.length-1]:null;
      const pos=head?new THREE.Vector3(head.x,head.y+60,head.z):null;
      const setArrow=(a,v,key)=>{ navHas[key]=!!v;
        if(v&&pos&&gridOn){a.position.copy(pos);
          a.setDirection(new THREE.Vector3(v[0],0,v[1]).normalize());a.visible=true;}
        else a.visible=false; };
      setArrow(navArrowFrontier, nd&&nd.frontier,'f');
      setArrow(navArrowRepulse,  nd&&nd.repulsion,'r');
      setArrow(navArrowPlateau, (nd&&nd.plateau_triggered)?nd.plateau:null,'p');
      // standoff committed heading draws as a bold red arrow (same slot as plateau)
      if(nd&&nd.standoff&&pos&&gridOn){navArrowPlateau.position.copy(pos);
        navArrowPlateau.setDirection(new THREE.Vector3(nd.standoff[0],0,nd.standoff[1]).normalize());
        navArrowPlateau.visible=true;}
      // 图例「实时」区：把静态语义变成当前量（数据全部来自本次已取的 mem）
      const ll=$('legendLive');
      if(ll){
        const ang=v=>v?(Math.atan2(v[0],v[1])*180/Math.PI).toFixed(0)+'°':'—';
        const lastSc=(mem.scene_changes&&mem.scene_changes.length)
          ? mem.scene_changes[mem.scene_changes.length-1].scene : '—';
        const lv=nd.standoff_level||0;
        const lvTxt=['正常','L1突围','L2反向','L3→COACH'][lv]||lv;
        const lvCol=['#3fb950','#58a6ff','#d29922','#f85149'][lv]||'#8b949e';
        ll.innerHTML='<b>实时</b>：前沿角 '+ang(nd.frontier)
          +' · 斥力 '+(nd.repulsion?'激活':'—')
          +' · 突围 '+(nd.plateau_triggered?'⚠️ 触发':'未触发')
          +' · 合力 <span style="color:'+(nd.resultant_norm<0.25?'#f85149':'#3fb950')+'">'+(nd.resultant_norm!=null?nd.resultant_norm.toFixed(2):'—')+'</span>'
          +' · 对峙 <span style="color:'+lvCol+'">'+lvTxt+'</span>'
          +' · 场景 '+lastSc
          +' · 格 '+(mem.heat_cells?mem.heat_cells.length:0)+'/'+(mem.total_cells??'??');
      }
    }catch(_){}
    // P0 display: scene-boundary markers (last 10 changes, oldest dropped).
    try{
      const sc=Array.isArray(mem.scene_changes)?mem.scene_changes.slice(-10):[];
      const shown=Math.min(sc.length,sceneLabels.length);
      for(let i=0;i<shown;i++){
        const c=sc[sc.length-shown+i];
        const base=mapY;
        sceneGroup.children[i*2].visible=true;
        sceneGroup.children[i*2].geometry.setAttribute('position',
          new THREE.Float32BufferAttribute([c.x,base,c.z, c.x,base+2500,c.z],3));
        sceneLabels[i].visible=true;
        // 错层排布：同一过渡区即便多条也不叠字（每条抬升 180 单位）
        sceneLabels[i].position.set(c.x,base+2200+i*180,c.z);
        sceneLabels[i].element.textContent='🎞️ '+(c.scene||'?').slice(0,16)+' · t='+c.t;
      }
      for(let i=shown;i<sceneLabels.length;i++){
        sceneGroup.children[i*2].visible=false;sceneLabels[i].visible=false;
      }
      sceneGroup.visible=shown>0;
    }catch(_){}
  }catch(_){}
}


let lastHud=0;
const sphTarget=new THREE.Vector3();   // playback cursor goal — animate() lerps
                                       // the sphere toward it (smooth motion
                                       // between sparse raw points)
function update(){
  if(!pts||!pts.length)return;
  const p=pts[pos]||pts[0];
  sphTarget.set(p.x,p.y,p.z);
  const hd=p.heading;
  arrow.setDirection(new THREE.Vector3(Math.sin(hd),0,Math.cos(hd)).normalize());
  $('frameInfo').textContent=pos+'/'+(pts.length-1);
  $('slider').value=pos;
  // Camera target: chase the cursor only during replay — in live-follow the
  // periodic zoom-to-path keeps the WHOLE path framed (chasing the head here
  // would immediately defeat fitView).
  if(playing) ctrl.target.copy(sphTarget);
  // HUD is expensive (innerHTML + DOM) — throttle to ~6 Hz; the 3D scene
  // still updates every frame for smooth motion.
  const now=performance.now();
  if(now-lastHud<150)return;
  lastHud=now;
  extendCum();
  const dist=cum[Math.min(pos,cum.length-1)]||0;
  $('stats').innerHTML='<div><span class=l>⏱</span> <span class=v>'+p.t+'s</span></div><div><span class=l>📍</span> <span class=v>['+(p.x|0)+','+(p.y|0)+','+(p.z|0)+']</span></div><div><span class=l>🧭</span> <span class=v>'+(p.heading*180/Math.PI|0)+'°</span></div><div><span class=l>🎮</span> <span class=v>x='+p.ctrl_x+' y='+p.ctrl_y+'</span></div><div><span class=l>📏</span> <span class=v>'+(dist|0)+'u</span></div>';
}

$('toggleView').onclick=()=>{mini=!mini;wrap.classList.toggle('mini',mini);$('toggleView').textContent=mini?'🗖':'✕';
  // P0：mini 小窗模式下自动收起图例 —— 图例钉在全屏顶部，而画布缩在右下角，
  // 两者视觉分离会让图例显得「悬空不具体」；展开全屏时再恢复。
  $('legend').style.display=mini?'none':'';
  setTimeout(resize,50);if(mini)fitView();};
sel.onchange=()=>{if(sel.value)loadFile(sel.value);};
$('slider').oninput=function(){follow=false;pos=+this.value;update();};
$('playBtn').onclick=function(){
  if(playing){playing=0;cancelAnimationFrame(anim);this.textContent='▶';return;}
  follow=false;                                // replay the full path; poller keeps appending new points
  if(follow||pos>=pts.length-1)pos=0;
  playing=1;this.textContent='⏸';spd=+$('speed').value;
  // Time-based playback: advance by elapsed time (points per 16.7 ms frame
  // at spd), so dropped frames cause speed-up — not position jumps.
  let lastTs=0;
  const step=(ts)=>{
    if(!playing){return;}
    if(pos>=pts.length-1){playing=0;$('playBtn').textContent='▶';return;}
    const dt=lastTs?Math.min(ts-lastTs,100):16.7;lastTs=ts;
    pos=Math.min(pos+spd*dt/16.7,pts.length-1);update();anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
};
$('gridBtn').onclick=function(){gridOn=!gridOn;carpet.visible=gridOn&&carpet.count>0;adjLines.visible=gridOn&&adjGeo.getAttribute('position')!=null;memDots.visible=gridOn&&memDots.geometry.getAttribute('position')!=null;syncNavArrows();this.textContent='🧠 Grid: '+(gridOn?'ON':'OFF');};
// Raw detail layer: faint unsmoothed telemetry line + dots under the main path
let rawOn=false;
const rawBtn=document.createElement('button');rawBtn.textContent='Raw: OFF';rawBtn.className='mini';
rawBtn.onclick=function(){rawOn=!rawOn;pathLine.visible=rawOn&&pathGeo.drawRange.count>1;dots.visible=rawOn;this.textContent='Raw: '+(rawOn?'ON':'OFF');};
$('gridBtn').parentNode.insertBefore(rawBtn,$('gridBtn').nextSibling);
// Follow-camera zoom-to-path: when following the live head, periodically
// re-frame the WHOLE path (the old behaviour chased Mario out of frame)
let lastFitDiag=0;
function pathDiag(){
  if(pts.length<2)return 0;
  let mnx=1e18,mxx=-1e18,mny=1e18,mxy=-1e18,mnz=1e18,mxz=-1e18;
  for(const p of pts){if(p.x<mnx)mnx=p.x;if(p.x>mxx)mxx=p.x;if(p.y<mny)mny=p.y;if(p.y>mxy)mxy=p.y;if(p.z<mnz)mnz=p.z;if(p.z>mxz)mxz=p.z;}
  return Math.hypot(mxx-mnx,mxy-mny,mxz-mnz);
}
setInterval(()=>{
  if(sel.value!=='__live__'||!follow||playing||pts.length<2)return;
  const d=pathDiag();
  if(d>lastFitDiag*1.25){fitView();lastFitDiag=d;}
},8000);
$('resetBtn').onclick=function(){playing=0;cancelAnimationFrame(anim);$('playBtn').textContent='▶';if(sel.value==='__live__'){follow=true;pos=pts.length-1;}else pos=0;update();};
function animate(){
  requestAnimationFrame(animate);
  // smooth playback: the sphere glides toward the cursor goal instead of
  // teleporting between raw telemetry points
  sphere.position.lerp(sphTarget, 0.18);
  arrow.position.copy(sphere.position);
  ctrl.update();renderer.render(scene,camera);lr.render(scene,camera);
}
animate();
window.addEventListener('resize',resize);
wrap.classList.add('mini');$('toggleView').textContent='🗖';
setTimeout(()=>{resize();loadList();},100);
</script></body></html>
