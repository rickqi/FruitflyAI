<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Fly64 3D Trajectory Replay</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px -apple-system,sans-serif;background:#0b1015;color:#f0f4f8;overflow:hidden;height:100vh}
#canvasWrap{position:absolute;inset:0;transition:all .3s ease}
#canvasWrap.mini{position:fixed;bottom:80px;right:16px;width:400px;height:280px;border-radius:10px;overflow:hidden;border:1px solid #354250;box-shadow:0 4px 20px rgba(0,0,0,.6);z-index:100}
#canvasWrap.mini canvas{width:100%!important;height:100%!important}
.controls{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(11,16,21,.92);border-top:1px solid #1a2430;flex-wrap:wrap}
.controls button,.controls select{background:#1a2430;color:#f0f4f8;border:1px solid #354250;border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer}
.controls button:hover{background:#2a3440}
.controls label{font-size:11px;color:#b0bdcc;display:flex;align-items:center;gap:4px}
.controls select{background:#0d1520}
input[type=range]{flex:1;min-width:100px;accent-color:#6cdaed;height:4px}
#info{position:absolute;top:8px;left:10px;z-index:10;background:rgba(11,16,21,.8);padding:4px 10px;border-radius:6px;border:1px solid #354250;pointer-events:none;font-size:12px}
#info h2{margin:0;font-size:13px;color:#6cdaed}
#frameInfo{color:#ffca72;margin-left:6px}
#liveDot{font-size:11px;font-weight:bold;margin-left:6px}
#stats{position:absolute;top:8px;right:10px;z-index:10;background:rgba(11,16,21,.8);padding:4px 8px;border-radius:6px;border:1px solid #354250;font-size:11px;line-height:1.5;pointer-events:none;min-width:100px}
#stats .l{color:#6cdaed}#stats .v{color:#f0f4f8}
#toggleView{position:fixed;bottom:52px;right:20px;z-index:9999;background:rgba(11,16,21,.85);border:1px solid #354250;border-radius:6px;color:#b0bdcc;cursor:pointer;padding:5px 10px;font-size:13px}
#toggleView:hover{background:#354250;color:#f0f4f8}
#fileSelect{max-width:200px}
#errorMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#2a1515;color:#ff6b6b;padding:14px;border-radius:6px;border:1px solid #ff6b6b;display:none;font-size:13px}
</style></head><body>
<div id="canvasWrap"><div id="info"><h2>🪰 Fly64 3D</h2><span id="buildTag" style="color:#536170;font-size:10px"></span><span id="liveDot">🟢 LIVE</span> <span id="frameInfo">0/0</span><div id="memInfo" style="color:#7dff9d;font-size:11px"></div></div><div id="stats"></div><div id="errorMsg"></div></div>
<div id="toggleView">🗖</div>
<div class="controls">
<button id="playBtn">▶</button><button id="resetBtn">⟲</button><button id="gridBtn">🧠 Grid: ON</button>
<label>Speed:<select id="speed"><option value="0.5" selected>0.5x</option><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select></label>
<label>File:<select id="fileSelect"><option>Loading...</option></select></label>
<input type="range" id="slider" min="0" max="0" value="0">
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $=id=>document.getElementById(id),wrap=$('canvasWrap');
const BUILD='2026-09-15b (follow-flag + time-based playback)';
document.getElementById('buildTag').textContent='build '+BUILD;
console.info('[fly64] trajectory.html build', BUILD);
let pts=[],playing=0,pos=0,spd=0.5,anim=null,mini=true,gridOn=true;
// follow=true: cursor rides the newest live point (default on Live source).
// Cleared by ▶ play / slider scrub so the full recorded path can be replayed
// without the poller yanking the cursor back to the head every 2 s (the
// flicker + "can't play" bug); ⟲ reset restores it.
let follow=true;
// diagnostics hook (module scope is otherwise closed to external tooling)
window.__liveState=()=>({n:pts.length,pos:Math.round(pos),playing,lastT:pts.length?pts[pts.length-1].t:null});
window.__gridState=()=>({carpetVisible:carpet.visible,carpetCount:carpet.count,gridOn,
  adjVisible:adjLines.visible,adjVerts:(adjGeo.getAttribute('position')?adjGeo.getAttribute('position').count/2:0)});

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1015);
const camera=new THREE.PerspectiveCamera(50,1,1,200000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.prepend(renderer.domElement);
const lr=new CSS2DRenderer();
lr.domElement.style.position='absolute';lr.domElement.style.top='0';lr.domElement.style.pointerEvents='none';
wrap.prepend(lr.domElement);
const ctrl=new OrbitControls(camera,renderer.domElement);
ctrl.enableDamping=true;ctrl.dampingFactor=.08;

const grid=new THREE.GridHelper(30000,30,0x354250,0x1a2430);scene.add(grid);
const pathMat=new THREE.LineBasicMaterial({color:0x6cdaed});pathMat.linewidth=1;
// Preallocated position buffer (matches backend retention cap): the poller
// writes points in place + setDrawRange — no GPU buffer reallocation per
// poll (the flicker/stutter source). Line and point cloud share one buffer.
const MAXP=6000;
const pathArr=new Float32Array(MAXP*3);
const pathGeo=new THREE.BufferGeometry();
pathGeo.setAttribute('position',new THREE.BufferAttribute(pathArr,3));
pathGeo.setDrawRange(0,0);
const pathLine=new THREE.Line(pathGeo,pathMat);scene.add(pathLine);
const dotMat=new THREE.PointsMaterial({color:0x6cdaed,sizeAttenuation:true,transparent:true,opacity:.25});
const dots=new THREE.Points(pathGeo,dotMat);scene.add(dots);
// Memory footprint overlay: recent_path cell centres from /memory.json
// (green = ordered short-term path the brain's spatial memory actually holds)
const memMat=new THREE.PointsMaterial({color:0x7dff9d,sizeAttenuation:true,transparent:true,opacity:.9});
const memGeo=new THREE.BufferGeometry();const memDots=new THREE.Points(memGeo,memMat);memDots.visible=false;scene.add(memDots);
// Spatial-memory ground layer: one translucent tile per visited grid cell,
// coloured by heat (same cold→hot ramp as the 2D heatmap), plus green
// LineSegments for the traversal topology (adjacency edges the brain holds).
const carpetGeo=new THREE.PlaneGeometry(196,196);carpetGeo.rotateX(-Math.PI/2);
const carpetMat=new THREE.MeshBasicMaterial({transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false});
const carpet=new THREE.InstancedMesh(carpetGeo,carpetMat,2600);carpet.count=0;carpet.visible=false;scene.add(carpet);
const adjGeo=new THREE.BufferGeometry();
const adjLines=new THREE.LineSegments(adjGeo,new THREE.LineBasicMaterial({color:0x7dff9d,transparent:true,opacity:.55}));
adjLines.visible=false;scene.add(adjLines);
const _m4=new THREE.Matrix4(),_c3=new THREE.Color();
function heatColor(t){ // cold(blue)→green→yellow→hot(red), matches 2D legend
  _c3.setHSL(0.62-0.62*Math.max(0,Math.min(1,t)),0.85,0.5);return _c3;}
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,12,12),new THREE.MeshBasicMaterial({color:0xffca72}));scene.add(sphere);
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,0),1,0xffca72,.3,.15);scene.add(arrow);
const mk=(t,c)=>{const d=document.createElement('div');d.textContent=t;d.style.color=c;d.style.fontSize='11px';d.style.fontWeight='bold';return new CSS2DObject(d);};
const sL=mk('🏁 Start','#4caf50'),eL=mk('🏁 End','#ff6b6b');scene.add(sL);scene.add(eL);
const sel=$('fileSelect');

function resize(){const r=wrap.getBoundingClientRect();const w=r.width||400,h=r.height||280;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);lr.setSize(w,h);}

function fitView(){
  if(pts.length<2)return;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),zs=pts.map(p=>p.z);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,cz=(Math.min(...zs)+Math.max(...zs))/2;
  const r=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),Math.max(...zs)-Math.min(...zs))/2+200;
  ctrl.target.set(cx,cy,cz);
  camera.position.set(cx+r*1.2,cy+r*0.7,cz+r*1.4);
  ctrl.update();
  // Scale objects proportional to trajectory bounds
  const s=r/2000;
  sphere.geometry.dispose();sphere.geometry=new THREE.SphereGeometry(Math.max(30,60*s),12,12);
  arrow.setLength(Math.max(150,350*s),Math.max(100,250*s)*.3,Math.max(50,150*s)*.15);
  dotMat.size=Math.max(8,25*s);dotMat.needsUpdate=true;
}

// Reuse the preallocated buffer: write in place + needsUpdate + drawRange.
let cum=[0];   // cumulative arc length cache — extends incrementally, O(1) lookups
function extendCum(){
  for(let i=cum.length;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    cum[i]=cum[i-1]+Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z);
  }
}
function pushPts(){
  const n=Math.min(pts.length,MAXP);
  for(let i=0;i<n;i++){pathArr[i*3]=pts[i].x;pathArr[i*3+1]=pts[i].y;pathArr[i*3+2]=pts[i].z;}
  pathGeo.attributes.position.needsUpdate=true;
  pathGeo.setDrawRange(0,n);
  extendCum();
}

function loadTrajectory(data, head){
  // head=true → live follow (cursor rides the newest point)
  pts=data;
  if(!pts||!pts.length){
    if(head){$('frameInfo').textContent='waiting for points…';return;}  // live: not an error, points not sampled yet
    $('errorMsg').textContent='Empty trajectory';$('errorMsg').style.display='block';return;}
  $('errorMsg').style.display='none';
  pos = head ? pts.length-1 : 0;
  $('slider').max=pts.length-1;
  if(pts.length<2){pushPts();update();return;}
  cum=[0];pushPts();
  sL.position.set(pts[0].x,pts[0].y+200,pts[0].z);
  eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
  fitView();update();
}

async function loadList(){
  try{const r=await fetch('/trajectory-list.json');if(!r.ok)throw Error('HTTP '+r.status);
    const list=await r.json();
    let html='<option value="__live__" selected>🟢 Live (current session · auto-refresh)</option>';
    if(list.length)html+=list.map(f=>'<option value="'+f.name+'">'+f.name.replace(/\.trajectory\.npz$/,'').slice(-30)+' ('+(f.size/1024|0)+'KB)</option>').join('');
    sel.innerHTML=html;
    loadFile('__live__');}catch(e){sel.innerHTML='<option>Error loading list</option>';$('errorMsg').textContent='List error: '+e.message;$('errorMsg').style.display='block';}
}

async function loadFile(name){
  try{
    let data;
    if(name==='__live__'){const r=await fetch('/trajectory.json');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      follow=true;   // re-selecting Live restores head-follow
      await refreshMemoryOverlay(data);
      loadTrajectory(data, true);
      setLive(true);
      $('frameInfo').textContent = (pts.length? pos+'/'+(pts.length-1) : 'waiting for points…');
    }
    else{setLive(false);const r=await fetch('/trajectory-load?file='+encodeURIComponent(name));if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      memDots.visible=false;carpet.visible=false;adjLines.visible=false;$('memInfo').textContent='';
      loadTrajectory(data, false);}
  }catch(e){$('errorMsg').textContent='Load error: '+e.message;$('errorMsg').style.display='block';}
}

// ── Live polling: every 2 s fetch /trajectory.json and MERGE only the new
// points (matched by t) into the existing buffer — the line grows instead of
// being reloaded, and playback is never interrupted.  The cursor follows the
// newest point only while it is already at/near the end (manual scrub wins).
let liveTimer=null;
function setLive(on){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  $('liveDot').textContent = on ? '🟢 LIVE' : '📄 REPLAY';
  if(on) liveTimer=setInterval(refreshLive, 2000);
}
async function refreshLive(){
  if(sel.value!=='__live__') return;          // replaying a saved file
  try{
    const r=await fetch('/trajectory.json'); if(!r.ok) return;
    const d=await r.json();
    if(!d||!d.length){$('frameInfo').textContent='waiting for points…';return;}
    await refreshMemoryOverlay(d);
    const lastT = pts.length ? pts[pts.length-1].t : -1;
    const fresh = d.filter(p=>p.t>lastT);
    if(!fresh.length) return;                 // nothing new since last poll
    pts = pts.concat(fresh).slice(-6000);   // match backend retention (whole session)
    pushPts();
    eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
    $('slider').max=pts.length-1;
    if(follow) pos=pts.length-1;   // ride the head ONLY in follow mode
    update();
  }catch(_){/* transient network blip — keep last good frame */}
}
async function refreshMemoryOverlay(traj){
  try{const m=await fetch('/memory.json');if(!m.ok)return;const mem=await m.json();
    // ground sample for tile height: y of nearest trajectory point (coarse)
    const samp=traj&&traj.length?traj.filter((_,i)=>i%5===0):[];
    const yAt=(x,z)=>{let best=0,bd=1e18;
      for(let i=0;i<samp.length;i++){const dx=samp[i].x-x,dz=samp[i].z-z,d2=dx*dx+dz*dz;
        if(d2<bd){bd=d2;best=samp[i].y;}}return bd<1e17?best-8:((traj[0]||{y:0}).y-8);};
    if(Array.isArray(mem.heat_cells)&&mem.heat_cells.length){
      const n=Math.min(mem.heat_cells.length,2600);
      let vy=0;for(const c of mem.heat_cells.slice(0,n))vy=yAt(c[0],c[1]);
      for(let i=0;i<n;i++){const c=mem.heat_cells[i];
        _m4.makeTranslation(c[0],yAt(c[0],c[1]),c[1]);
        carpet.setMatrixAt(i,_m4);
        carpet.setColorAt(i,heatColor(c[2]));}
      carpet.count=n;carpet.instanceMatrix.needsUpdate=true;
      if(carpet.instanceColor)carpet.instanceColor.needsUpdate=true;
      carpet.visible=gridOn;
    }
    if(Array.isArray(mem.adjacency)&&mem.adjacency.length){
      const flat=[];
      for(const e of mem.adjacency){const y1=yAt(e[0],e[1])+6,y2=yAt(e[2],e[3])+6;
        flat.push(e[0],y1,e[1],e[2],y2,e[3]);}
      adjGeo.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
      adjLines.visible=gridOn;
    }
    if(Array.isArray(mem.recent_path)&&mem.recent_path.length){
      const y0=(traj[0]||{y:0}).y;
      memGeo.setAttribute('position',new THREE.Float32BufferAttribute(
        mem.recent_path.flatMap(c=>[c.x,y0+4,c.z]),3));
      memDots.visible=true;
      $('memInfo').textContent='🧠 memory: '+mem.recent_path.length+' path cells · '
        +(mem.adjacency_edges??'?')+' edges · '+(mem.heat_cells?mem.heat_cells.length:0)+' grid tiles'
        +' · noveltyDir '+(mem.cx_novelty_direction??'—');
    }}catch(_){}}


let lastHud=0;
function update(){
  if(!pts||!pts.length)return;
  const p=pts[pos]||pts[0];
  sphere.position.set(p.x,p.y,p.z);
  const hd=p.heading;
  arrow.position.copy(sphere.position);
  arrow.setDirection(new THREE.Vector3(Math.sin(hd),0,Math.cos(hd)).normalize());
  $('frameInfo').textContent=pos+'/'+(pts.length-1);
  $('slider').value=pos;
  ctrl.target.copy(sphere.position);
  // HUD is expensive (innerHTML + DOM) — throttle to ~6 Hz; the 3D scene
  // still updates every frame for smooth motion.
  const now=performance.now();
  if(now-lastHud<150)return;
  lastHud=now;
  extendCum();
  const dist=cum[Math.min(pos,cum.length-1)]||0;
  $('stats').innerHTML='<div><span class=l>⏱</span> <span class=v>'+p.t+'s</span></div><div><span class=l>📍</span> <span class=v>['+(p.x|0)+','+(p.y|0)+','+(p.z|0)+']</span></div><div><span class=l>🧭</span> <span class=v>'+(p.heading*180/Math.PI|0)+'°</span></div><div><span class=l>🎮</span> <span class=v>x='+p.ctrl_x+' y='+p.ctrl_y+'</span></div><div><span class=l>📏</span> <span class=v>'+(dist|0)+'u</span></div>';
}

$('toggleView').onclick=()=>{mini=!mini;wrap.classList.toggle('mini',mini);$('toggleView').textContent=mini?'🗖':'✕';setTimeout(resize,50);if(mini)fitView();};
sel.onchange=()=>{if(sel.value)loadFile(sel.value);};
$('slider').oninput=function(){follow=false;pos=+this.value;update();};
$('playBtn').onclick=function(){
  if(playing){playing=0;cancelAnimationFrame(anim);this.textContent='▶';return;}
  follow=false;                                // replay the full path; poller keeps appending new points
  if(follow||pos>=pts.length-1)pos=0;
  playing=1;this.textContent='⏸';spd=+$('speed').value;
  // Time-based playback: advance by elapsed time (points per 16.7 ms frame
  // at spd), so dropped frames cause speed-up — not position jumps.
  let lastTs=0;
  const step=(ts)=>{
    if(!playing){return;}
    if(pos>=pts.length-1){playing=0;$('playBtn').textContent='▶';return;}
    const dt=lastTs?Math.min(ts-lastTs,100):16.7;lastTs=ts;
    pos=Math.min(pos+spd*dt/16.7,pts.length-1);update();anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
};
$('gridBtn').onclick=function(){gridOn=!gridOn;carpet.visible=gridOn&&carpet.count>0;adjLines.visible=gridOn&&adjGeo.getAttribute('position')!=null;this.textContent='🧠 Grid: '+(gridOn?'ON':'OFF');};
$('resetBtn').onclick=function(){playing=0;cancelAnimationFrame(anim);$('playBtn').textContent='▶';if(sel.value==='__live__'){follow=true;pos=pts.length-1;}else pos=0;update();};
function animate(){requestAnimationFrame(animate);ctrl.update();renderer.render(scene,camera);lr.render(scene,camera);}
animate();
window.addEventListener('resize',resize);
wrap.classList.add('mini');$('toggleView').textContent='🗖';
setTimeout(()=>{resize();loadList();},100);
</script></body></html>
