<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Fly64 3D Trajectory Replay</title>
<style>

<div id="canvasWrap"><div id="info"><h2>🪰 Fly64 3D</h2><span id="buildTag" style="color:#536170;font-size:10px"></span><span id="liveDot">🟢 LIVE</span> <span id="frameInfo">0/0</span><div id="memInfo" style="color:#7dff9d;font-size:11px"></div></div><div id="stats"></div><div id="errorMsg"></div></div>

<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { heightColor, verticalSegmentCount, verticalStep, autoGroundY } from './trajectory-height.js';

const $=id=>document.getElementById(id),wrap=$('canvasWrap');
const BUILD='2026-09-15b (follow-flag + time-based playback)';
document.getElementById('buildTag').textContent='build '+BUILD;
console.info('[fly64] trajectory.html build', BUILD);
let pts=[],playing=0,pos=0,spd=0.5,anim=null,mini=true,gridOn=true;
// follow=true: cursor rides the newest live point (default on Live source).
// Cleared by ▶ play / slider scrub so the full recorded path can be replayed
// without the poller yanking the cursor back to the head every 2 s (the
// flicker + "can't play" bug); ⟲ reset restores it.
let follow=true;
// memory-map plane height (flat base under the whole path) — updated by pushPts
let mapY=120;
// diagnostics hook (module scope is otherwise closed to external tooling)
window.__liveState=()=>({n:pts.length,pos:Math.round(pos),playing,lastT:pts.length?pts[pts.length-1].t:null});
window.__gridState=()=>({carpetVisible:carpet.visible,carpetCount:carpet.count,gridOn,
  adjVisible:adjLines.visible,adjVerts:(adjGeo.getAttribute('position')?adjGeo.getAttribute('position').count/2:0)});
window.__drawState=()=>({raw:pts.length,drawn:(pathGeo.drawRange?pathGeo.drawRange.count:-1),
  smooth:typeof smoothPts==='function'?smoothPts().length:0});
// t22 diagnostics: height gradient + vertical reference line state
window.__line2State=()=>({type:mainPath.type,linewidth:mainMat.linewidth});
window.__carpetColors=()=>{const c=carpet;if(!c||!c.count)return{count:0};const n=Math.min(c.count,1200);let mnR=1,mxR=0,mnG=1,mxG=0,mnB=1,mxB=0;const col=new THREE.Color();for(let i=0;i<n;i+=Math.max(1,Math.floor(n/30))){try{c.getColorAt(i,col);}catch{break}if(col.r<mnR)mnR=col.r;if(col.r>mxR)mxR=col.r;if(col.g<mnG)mnG=col.g;if(col.g>mxG)mxG=col.g;if(col.b<mnB)mnB=col.b;if(col.b>mxB)mxB=col.b;}return{count:n,range:{R:[+mnR.toFixed(2),+mxR.toFixed(2)],G:[+mnG.toFixed(2),+mxG.toFixed(2)],B:[+mnB.toFixed(2),+mxB.toFixed(2)]}};};
window.__heightState=()=>({minY:heightRange.min,maxY:heightRange.max,
  colored:(pathGeo.getAttribute('color')?pathGeo.attributes.color.count:0),
  vertSegments:(vertGeo.getAttribute('position')?vertGeo.attributes.position.count/2:0),
  gridY:grid.position.y,groundBaseline:120});

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1015);
const camera=new THREE.PerspectiveCamera(50,1,1,200000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.prepend(renderer.domElement);
const lr=new CSS2DRenderer();
lr.domElement.style.position='absolute';lr.domElement.style.top='0';lr.domElement.style.pointerEvents='none';
wrap.prepend(lr.domElement);
const ctrl=new OrbitControls(camera,renderer.domElement);
ctrl.enableDamping=true;ctrl.dampingFactor=.08;

const grid=new THREE.GridHelper(30000,30,0x354250,0x1a2430);scene.add(grid);
// t22 #3: grid plane rides the auto-detected ground height (first trajectory
// point, falling back to the SM64 ground baseline 120) instead of hard y=0.
grid.position.y=autoGroundY(pts);
const pathMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.16});
pathMat.linewidth=1;
// Raw layer = unsmoothed telemetry (faint, toggleable "detail" underlay).
// Main layer = decimated+Chaikin-smoothed path drawn with Line2 (real 2.5px
// width via LineMaterial).  Both share height-gradient vertex colours.
const MAXP=6000;
const pathArr=new Float32Array(MAXP*3);
// t22 #1: per-vertex height colour attribute — blue(low Y) → red(high Y).
const pathColArr=new Float32Array(MAXP*3);
const pathGeo=new THREE.BufferGeometry();
pathGeo.setAttribute('position',new THREE.BufferAttribute(pathArr,3));
pathGeo.setAttribute('color',new THREE.BufferAttribute(pathColArr,3));
pathGeo.setDrawRange(0,0);
const pathLine=new THREE.Line(pathGeo,pathMat);pathLine.visible=false;scene.add(pathLine);
const dotMat=new THREE.PointsMaterial({vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.25});
const dots=new THREE.Points(pathGeo,dotMat);dots.visible=false;scene.add(dots);
// Main smoothed path (thick, always visible)
// Main smoothed path (Line2, 2.5px) — vendor-addons imported statically
// at the module top, so always available (no more lazy-load fallback).
const mainGeo=new LineGeometry();
const mainMat=new LineMaterial({vertexColors:true,linewidth:2.5});
mainMat.resolution.set(innerWidth,innerHeight);
const mainPath=new Line2(mainGeo,mainMat);scene.add(mainPath);
// t22 #2: vertical reference lines — every Nth path point drops a segment to
// the SM64 ground baseline (y=120).  Preallocated LineSegments (GPU-cheap:
// one draw call, in-place writes + drawRange).
const MAXV=1500;
const vertArr=new Float32Array(MAXV*2*3);
const vertGeo=new THREE.BufferGeometry();
vertGeo.setAttribute('position',new THREE.BufferAttribute(vertArr,3));
vertGeo.setDrawRange(0,0);
const vertLines=new THREE.LineSegments(vertGeo,new THREE.LineBasicMaterial({color:0x536170,transparent:true,opacity:.35}));
vertLines.visible=false;scene.add(vertLines);
// Memory footprint overlay: recent_path cell centres from /memory.json
// (green = ordered short-term path the brain's spatial memory actually holds)
const memMat=new THREE.PointsMaterial({color:0x7dff9d,sizeAttenuation:true,transparent:true,opacity:.9});
const memGeo=new THREE.BufferGeometry();const memDots=new THREE.Points(memGeo,memMat);memDots.visible=false;scene.add(memDots);
// Spatial-memory ground layer: one translucent tile per visited grid cell,
// coloured by heat (same cold→hot ramp as the 2D heatmap), plus green
// LineSegments for the traversal topology (adjacency edges the brain holds).
const carpetGeo=new THREE.PlaneGeometry(196,196);carpetGeo.rotateX(-Math.PI/2);
const carpetMat=new THREE.MeshBasicMaterial({transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false});
const carpet=new THREE.InstancedMesh(carpetGeo,carpetMat,2600);carpet.count=0;carpet.visible=false;scene.add(carpet);
const adjGeo=new THREE.BufferGeometry();
const adjLines=new THREE.LineSegments(adjGeo,new THREE.LineBasicMaterial({color:0x7dff9d,transparent:true,opacity:.55}));
adjLines.visible=false;scene.add(adjLines);
const _m4=new THREE.Matrix4(),_c3=new THREE.Color();
function heatColor(t){ // cold(blue)→green→yellow→hot(red), matches 2D legend
  _c3.setHSL(0.62-0.62*Math.max(0,Math.min(1,t)),0.85,0.5);return _c3;}
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,12,12),new THREE.MeshBasicMaterial({color:0xffca72}));scene.add(sphere);
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,0),1,0xffca72,.3,.15);scene.add(arrow);
const mk=(t,c)=>{const d=document.createElement('div');d.textContent=t;d.style.color=c;d.style.fontSize='11px';d.style.fontWeight='bold';return new CSS2DObject(d);};
const sL=mk('🏁 Start','#4caf50'),eL=mk('🏁 End','#ff6b6b');scene.add(sL);scene.add(eL);
const sel=$('fileSelect');

function resize(){const r=wrap.getBoundingClientRect();const w=r.width||400,h=r.height||280;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);lr.setSize(w,h);if(mainMat)mainMat.resolution.set(w,h);}

function fitView(){
  if(pts.length<2)return;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),zs=pts.map(p=>p.z);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,cz=(Math.min(...zs)+Math.max(...zs))/2;
  const r=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),Math.max(...zs)-Math.min(...zs))/2+200;
  ctrl.target.set(cx,cy,cz);
  camera.position.set(cx+r*1.2,cy+r*0.7,cz+r*1.4);
  ctrl.update();
  // Scale objects proportional to trajectory bounds
  const s=r/2000;
  sphere.geometry.dispose();sphere.geometry=new THREE.SphereGeometry(Math.max(30,60*s),12,12);
  arrow.setLength(Math.max(150,350*s),Math.max(100,250*s)*.3,Math.max(50,150*s)*.15);
  dotMat.size=Math.max(8,25*s);dotMat.needsUpdate=true;
  try{lastFitDiag=pathDiag();}catch(_){}
}

// Reuse the preallocated buffer: write in place + needsUpdate + drawRange.
let cum=[0];   // cumulative arc length cache — extends incrementally, O(1) lookups
function extendCum(){
  for(let i=cum.length;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    cum[i]=cum[i-1]+Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z);
  }
}
// t22 #1/#2: height-gradient colours + vertical reference lines, written
// in place alongside the position buffer (single pass, O(n)).
// t22 #4: raw telemetry contains physics jitter — rendering all 6000 points
// as a polyline turns the path into a scribble.  The render path now runs
// distance-decimation (adaptive threshold) + one Chaikin corner-cutting pass
// over the raw points; playback still uses the raw points for accuracy.
const GROUND_Y=120;                 // SM64 ground baseline
let heightRange={min:0,max:0};
function decimThr(){
  if(pts.length<3)return 10;
  let mnx=1e18,mxx=-1e18,mnz=1e18,mxz=-1e18;
  for(const p of pts){if(p.x<mnx)mnx=p.x;if(p.x>mxx)mxx=p.x;if(p.z<mnz)mnz=p.z;if(p.z>mxz)mxz=p.z;}
  return Math.max(10, Math.hypot(mxx-mnx, mxz-mnz)*0.004);
}
function smoothPts(){
  const n=Math.min(pts.length,MAXP);
  if(n<3)return pts.slice(0,n);
  let mnx=1e18,mxx=-1e18,mnz=1e18,mxz=-1e18;
  for(const p of pts){if(p.x<mnx)mnx=p.x;if(p.x>mxx)mxx=p.x;if(p.z<mnz)mnz=p.z;if(p.z>mxz)mxz=p.z;}
  const diag=Math.hypot(mxx-mnx, mxz-mnz);
  // iterative threshold: guarantee ≤ ~3000 kept points so the Chaikin pass
  // (×2-1) stays inside the 6000-point GPU buffer (no tail truncation)
  let thr=Math.max(10, diag*0.004), keep=[];
  for(let iter=0;iter<6;iter++){
    keep=[pts[0]];
    let lx=pts[0].x,ly=pts[0].y,lz=pts[0].z;
    for(let i=1;i<n-1;i++){const p=pts[i];
      if(Math.hypot(p.x-lx,p.y-ly,p.z-lz)>=thr){keep.push(p);lx=p.x;ly=p.y;lz=p.z;}}
    keep.push(pts[n-1]);
    if(keep.length<=3000)break;
    thr*=1.6;
  }
  if(keep.length<3)return keep;
  const sm=[keep[0]];
  for(let i=0;i<keep.length-1;i++){const a=keep[i],b=keep[i+1];
    sm.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25,z:a.z*.75+b.z*.25,t:(a.t||0)*.75+(b.t||0)*.25},
            {x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75,z:a.z*.25+b.z*.75,t:(a.t||0)*.25+(b.t||0)*.75});}
  sm.push(keep[keep.length-1]);
  return sm;
}
function pushPts(){
  const n=Math.min(pts.length,MAXP);
  let ymin=Infinity,ymax=-Infinity;
  for(let i=0;i<n;i++){const y=pts[i].y;if(y<ymin)ymin=y;if(y>ymax)ymax=y;}
  if(!isFinite(ymin)){ymin=0;ymax=0;}
  heightRange={min:ymin,max:ymax};
  const span=Math.max(1e-6,ymax-ymin);
  // memory-map plane: flat base under the whole path — carpet, topology edges
  // and memory dots all sit here, so the grid aligns horizontally with the
  // trajectory footprint exactly (the old per-tile nearest-y scatter is gone).
  mapY=(pts.length?ymin:120)-12;
  const colAttr=pathGeo.attributes.color;
  // ── raw detail layer (thin, faint): every telemetry point ──
  for(let i=0;i<n;i++){
    pathArr[i*3]=pts[i].x;pathArr[i*3+1]=pts[i].y;pathArr[i*3+2]=pts[i].z;
    const rgb=heightColor((pts[i].y-ymin)/span);
    pathColArr[i*3]=rgb[0];pathColArr[i*3+1]=rgb[1];pathColArr[i*3+2]=rgb[2];
  }
  pathGeo.attributes.position.needsUpdate=true;
  colAttr.needsUpdate=true;
  pathGeo.setDrawRange(0,n);
  // ── main smoothed layer (Line2, 2.5px) ──
  const sm=smoothPts();
  const flat=[],cols=[];
  for(const p of sm){
    flat.push(p.x,p.y,p.z);
    const rgb=heightColor((p.y-ymin)/span);
    cols.push(rgb[0],rgb[1],rgb[2]);
  }
  if(sm.length>=2){mainGeo.setPositions(flat);mainGeo.setColors(cols);}
  // vertical drop-lines: every Nth point → memory-map plane
  const seg=verticalSegmentCount(n),step=verticalStep(n);
  let v=0;
  for(let i=0;i<n&&v<seg;i+=step){
    const p=pts[i];
    vertArr[v*6]=p.x;vertArr[v*6+1]=p.y;vertArr[v*6+2]=p.z;
    vertArr[v*6+3]=p.x;vertArr[v*6+4]=mapY;vertArr[v*6+5]=p.z;
    v++;
  }
  vertGeo.attributes.position.needsUpdate=true;
  vertGeo.setDrawRange(0,v*2);
  vertLines.visible=v>0;
  extendCum();
}

function loadTrajectory(data, head){
  // head=true → live follow (cursor rides the newest point)
  pts=data;
  if(!pts||!pts.length){
    if(head){$('frameInfo').textContent='waiting for points…';return;}  // live: not an error, points not sampled yet
    $('errorMsg').textContent='Empty trajectory';$('errorMsg').style.display='block';return;}
  $('errorMsg').style.display='none';
  pos = head ? pts.length-1 : 0;
  // t22 #3: keep the ground grid on the trajectory's own base height
  grid.position.y=autoGroundY(pts);
  $('slider').max=pts.length-1;
  if(pts.length<2){pushPts();update();return;}
  cum=[0];pushPts();
  sL.position.set(pts[0].x,pts[0].y+200,pts[0].z);
  eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
  fitView();update();
}

async function loadList(){
  try{const r=await fetch('/trajectory-list.json');if(!r.ok)throw Error('HTTP '+r.status);
    const list=await r.json();
    let html='<option value="__live__" selected>🟢 Live (current session · auto-refresh)</option>';
    if(list.length)html+=list.map(f=>'<option value="'+f.name+'">'+f.name.replace(/\.trajectory\.npz$/,'').slice(-30)+' ('+(f.size/1024|0)+'KB)</option>').join('');
    sel.innerHTML=html;
    loadFile('__live__');}catch(e){sel.innerHTML='<option>Error loading list</option>';$('errorMsg').textContent='List error: '+e.message;$('errorMsg').style.display='block';}
}

async function loadFile(name){
  try{
    let data;
    if(name==='__live__'){const r=await fetch('/trajectory.json');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      follow=true;   // re-selecting Live restores head-follow
      await refreshMemoryOverlay(data);
      loadTrajectory(data, true);
      setLive(true);
      $('frameInfo').textContent = (pts.length? pos+'/'+(pts.length-1) : 'waiting for points…');
    }
    else{setLive(false);const r=await fetch('/trajectory-load?file='+encodeURIComponent(name));if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();
      memDots.visible=false;carpet.visible=false;adjLines.visible=false;$('memInfo').textContent='';
      loadTrajectory(data, false);}
  }catch(e){$('errorMsg').textContent='Load error: '+e.message;$('errorMsg').style.display='block';}
}

// ── Live polling: every 2 s fetch /trajectory.json and MERGE only the new
// points (matched by t) into the existing buffer — the line grows instead of
// being reloaded, and playback is never interrupted.  The cursor follows the
// newest point only while it is already at/near the end (manual scrub wins).
let liveTimer=null;
function setLive(on){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  $('liveDot').textContent = on ? '🟢 LIVE' : '📄 REPLAY';
  if(on) liveTimer=setInterval(refreshLive, 2000);
}
async function refreshLive(){
  if(sel.value!=='__live__') return;          // replaying a saved file
  try{
    const r=await fetch('/trajectory.json'); if(!r.ok) return;
    const d=await r.json();
    if(!d||!d.length){$('frameInfo').textContent='waiting for points…';return;}
    await refreshMemoryOverlay(d);
    const lastT = pts.length ? pts[pts.length-1].t : -1;
    const fresh = d.filter(p=>p.t>lastT);
    if(!fresh.length) return;                 // nothing new since last poll
    pts = pts.concat(fresh).slice(-6000);   // match backend retention (whole session)
    pushPts();
    eL.position.set(pts[pts.length-1].x,pts[pts.length-1].y+200,pts[pts.length-1].z);
    $('slider').max=pts.length-1;
    if(follow) pos=pts.length-1;   // ride the head ONLY in follow mode
    update();
  }catch(_){/* transient network blip — keep last good frame */}
}
async function refreshMemoryOverlay(traj){
  console.log('[fly64] refreshMemoryOverlay called, traj.len='+(traj?traj.length:'null')+' points');
  try{const m=await fetch('/memory.json');if(!m.ok)return;const mem=await m.json();
    console.log('[fly64] memory.json loaded, heat_cells='+(Array.isArray(mem.heat_cells)?mem.heat_cells.length:'none'));
    // The memory grid is a TOP-DOWN occupancy map: carpet tiles, adjacency
    // edges and memory dots all sit on ONE flat plane (mapY) directly under
    // the trajectory footprint — horizontal (x,z) alignment with the path is
    // exact; height is conveyed by the path line + drop-lines instead.
    const my=mapY;
    // ── Carpet: elevation-coloured tiles (height gradient matching the
    // path), with recency controlling luminance.  Tiles above the median
    // elevation glow warm (→red) — tiles below glow cool (→blue).  This
    // adds a height/depth dimension to the flat memory grid.
    const cs = 200;   // cell size, must match memory.py
    const cellH = {}; // per-cell mean height from the trajectory
    for (const p of traj) {
      const k = Math.floor(p.x / cs).toFixed(0) + ',' + Math.floor(p.z / cs).toFixed(0);
      (cellH[k] = cellH[k] || []).push(p.y);
    }
    const hMin = heightRange.min, hSpan = Math.max(heightRange.max - hMin, 1e-6);
    if (Array.isArray(mem.heat_cells) && mem.heat_cells.length) {
      const n = Math.min(mem.heat_cells.length, 2600);
      const ky = (x,z) => Math.floor(x/cs).toFixed(0) + ',' + Math.floor(z/cs).toFixed(0);
      for (let i = 0; i < n; i++) {
        const c = mem.heat_cells[i];
        _m4.makeTranslation(c[0], my, c[1]);
        carpet.setMatrixAt(i, _m4);
        // elevation colour from per-cell mean height
        const h0 = cellH[ky(c[0], c[1])];
        const cy = h0 ? h0.reduce((s,v)=>s+v,0)/h0.length : (hMin + hSpan * 0.5);
        const rgb = heightColor((cy - hMin) / hSpan);
        const lum = 0.35 + Math.min(c[2], 1) * 0.65;  // recency → brightness
        _c3.set(rgb[0] * lum, rgb[1] * lum, rgb[2] * lum);
        carpet.setColorAt(i, _c3);
      }
      carpet.count = n; carpet.instanceMatrix.needsUpdate = true;
      if (carpet.instanceColor) carpet.instanceColor.needsUpdate = true;
      carpet.visible = gridOn;
    }
    if(Array.isArray(mem.adjacency)&&mem.adjacency.length){
      const flat=[];
      for(const e of mem.adjacency){flat.push(e[0],my+4,e[1],e[2],my+4,e[3]);}
      adjGeo.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
      adjLines.visible=gridOn;
    }
    if(Array.isArray(mem.recent_path)&&mem.recent_path.length){
      memGeo.setAttribute('position',new THREE.Float32BufferAttribute(
        mem.recent_path.flatMap(c=>[c.x,my+7,c.z]),3));
      memDots.visible=true;
      $('memInfo').textContent='🧠 memory: '+mem.recent_path.length+' path cells · '
        +(mem.adjacency_edges??'?')+' edges · '+(mem.heat_cells?mem.heat_cells.length:0)+' grid tiles'
        +' · noveltyDir '+(mem.cx_novelty_direction??'—');
    }}catch(_){}}


let lastHud=0;
const sphTarget=new THREE.Vector3();   // playback cursor goal — animate() lerps
                                       // the sphere toward it (smooth motion
                                       // between sparse raw points)
function update(){
  if(!pts||!pts.length)return;
  const p=pts[pos]||pts[0];
  sphTarget.set(p.x,p.y,p.z);
  const hd=p.heading;
  arrow.setDirection(new THREE.Vector3(Math.sin(hd),0,Math.cos(hd)).normalize());
  $('frameInfo').textContent=pos+'/'+(pts.length-1);
  $('slider').value=pos;
  // Camera target: chase the cursor only during replay — in live-follow the
  // periodic zoom-to-path keeps the WHOLE path framed (chasing the head here
  // would immediately defeat fitView).
  if(playing) ctrl.target.copy(sphTarget);
  // HUD is expensive (innerHTML + DOM) — throttle to ~6 Hz; the 3D scene
  // still updates every frame for smooth motion.
  const now=performance.now();
  if(now-lastHud<150)return;
  lastHud=now;
  extendCum();
  const dist=cum[Math.min(pos,cum.length-1)]||0;
  $('stats').innerHTML='<div><span class=l>⏱</span> <span class=v>'+p.t+'s</span></div><div><span class=l>📍</span> <span class=v>['+(p.x|0)+','+(p.y|0)+','+(p.z|0)+']</span></div><div><span class=l>🧭</span> <span class=v>'+(p.heading*180/Math.PI|0)+'°</span></div><div><span class=l>🎮</span> <span class=v>x='+p.ctrl_x+' y='+p.ctrl_y+'</span></div><div><span class=l>📏</span> <span class=v>'+(dist|0)+'u</span></div>';
}

$('toggleView').onclick=()=>{mini=!mini;wrap.classList.toggle('mini',mini);$('toggleView').textContent=mini?'🗖':'✕';setTimeout(resize,50);if(mini)fitView();};
sel.onchange=()=>{if(sel.value)loadFile(sel.value);};
$('slider').oninput=function(){follow=false;pos=+this.value;update();};
$('playBtn').onclick=function(){
  if(playing){playing=0;cancelAnimationFrame(anim);this.textContent='▶';return;}
  follow=false;                                // replay the full path; poller keeps appending new points
  if(follow||pos>=pts.length-1)pos=0;
  playing=1;this.textContent='⏸';spd=+$('speed').value;
  // Time-based playback: advance by elapsed time (points per 16.7 ms frame
  // at spd), so dropped frames cause speed-up — not position jumps.
  let lastTs=0;
  const step=(ts)=>{
    if(!playing){return;}
    if(pos>=pts.length-1){playing=0;$('playBtn').textContent='▶';return;}
    const dt=lastTs?Math.min(ts-lastTs,100):16.7;lastTs=ts;
    pos=Math.min(pos+spd*dt/16.7,pts.length-1);update();anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
};
$('gridBtn').onclick=function(){gridOn=!gridOn;carpet.visible=gridOn&&carpet.count>0;adjLines.visible=gridOn&&adjGeo.getAttribute('position')!=null;memDots.visible=gridOn&&memDots.geometry.getAttribute('position')!=null;this.textContent='🧠 Grid: '+(gridOn?'ON':'OFF');};
// Raw detail layer: faint unsmoothed telemetry line + dots under the main path
let rawOn=false;
const rawBtn=document.createElement('button');rawBtn.textContent='Raw: OFF';rawBtn.className='mini';
rawBtn.onclick=function(){rawOn=!rawOn;pathLine.visible=rawOn&&pathGeo.drawRange.count>1;dots.visible=rawOn;this.textContent='Raw: '+(rawOn?'ON':'OFF');};
$('gridBtn').parentNode.insertBefore(rawBtn,$('gridBtn').nextSibling);
// Follow-camera zoom-to-path: when following the live head, periodically
// re-frame the WHOLE path (the old behaviour chased Mario out of frame)
let lastFitDiag=0;
function pathDiag(){
  if(pts.length<2)return 0;
  let mnx=1e18,mxx=-1e18,mny=1e18,mxy=-1e18,mnz=1e18,mxz=-1e18;
  for(const p of pts){if(p.x<mnx)mnx=p.x;if(p.x>mxx)mxx=p.x;if(p.y<mny)mny=p.y;if(p.y>mxy)mxy=p.y;if(p.z<mnz)mnz=p.z;if(p.z>mxz)mxz=p.z;}
  return Math.hypot(mxx-mnx,mxy-mny,mxz-mnz);
}
setInterval(()=>{
  if(sel.value!=='__live__'||!follow||playing||pts.length<2)return;
  const d=pathDiag();
  if(d>lastFitDiag*1.25){fitView();lastFitDiag=d;}
},8000);
$('resetBtn').onclick=function(){playing=0;cancelAnimationFrame(anim);$('playBtn').textContent='▶';if(sel.value==='__live__'){follow=true;pos=pts.length-1;}else pos=0;update();};
function animate(){
  requestAnimationFrame(animate);
  // smooth playback: the sphere glides toward the cursor goal instead of
  // teleporting between raw telemetry points
  sphere.position.lerp(sphTarget, 0.18);
  arrow.position.copy(sphere.position);
  ctrl.update();renderer.render(scene,camera);lr.render(scene,camera);
}
animate();
window.addEventListener('resize',resize);
wrap.classList.add('mini');$('toggleView').textContent='🗖';
setTimeout(()=>{resize();loadList();},100);
</script></body></html>
