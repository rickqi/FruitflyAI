<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Fly64 Trajectory Replay</title>
<style>
body{font:14px -apple-system,sans-serif;background:#0b1015;color:#f0f4f8;margin:20px}
#canvas{background:#162029;border:1px solid #354250;border-radius:8px;display:block;margin:10px 0}
.controls{display:flex;gap:12px;align-items:center;margin:10px 0}
button{background:#354250;color:#f0f4f8;border:none;padding:6px 16px;border-radius:4px;cursor:pointer}
button:hover{background:#4a5a6a}
input[type=range]{width:400px}
.info{color:#b0bdcc;font-size:12px;margin:5px 0}
#stats{display:flex;gap:20px;flex-wrap:wrap}
.stat{background:#162029;padding:8px 14px;border-radius:6px;border:1px solid #354250}
.stat label{color:#6cdaed;display:block;font-size:11px}
.stat span{font-size:16px;font-weight:600}
</style></head><body>
<h2>🪰 Fly64 Trajectory Replay</h2>
<div class="controls">
<button id="playBtn">▶ Play</button>
<button id="resetBtn">⟲ Reset</button>
<label>Speed: <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select></label>
<span id="frameInfo">0 / 0</span>
</div>
<input type="range" id="slider" min="0" max="0" value="0" style="width:100%">
<canvas id="canvas" width="600" height="400"></canvas>
<div id="stats"></div>
<script>
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let points=[],playing=false,pos=0,speed=1,animId=null;
async function load(){const r=await fetch('/trajectory.json');points=await r.json();max=points.length-1;document.getElementById('slider').max=max;render();}
function render(){
  ctx.clearRect(0,0,600,400);
  if(!points.length)return;
  const xs=points.map(p=>p.x),ys=points.map(p=>p.z);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const rangeX=Math.max(maxX-minX,1),rangeY=Math.max(maxY-minY,1);
  const pad=40,scale=Math.min((600-2*pad)/rangeX,(400-2*pad)/rangeY);
  const map=(x,y)=>({x:pad+(x-minX)*scale,y:400-pad-(y-minY)*scale});
  // Draw path
  ctx.beginPath();ctx.strokeStyle='#6cdaed';ctx.lineWidth=2;
  for(let i=0;i<=pos&&i<points.length;i++){const p=map(points[i].x,points[i].z);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
  ctx.stroke();
  // Current position
  if(pos<points.length){const p=map(points[pos].x,points[pos].z);
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle='#ffca72';ctx.fill();
    // Heading direction
    const h=points[pos].heading;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+15*Math.sin(h),p.y-15*Math.cos(h));ctx.strokeStyle='#ffca72';ctx.lineWidth=2;ctx.stroke();
  }
  // Start
  const s=map(points[0].x,points[0].z);ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();ctx.fillText('Start',s.x+8,s.y+4);
  // Info
  const p=points[pos]||points[0];document.getElementById('frameInfo').textContent=pos+'/'+(points.length-1);
  const h=document.getElementById('stats');
  h.innerHTML='<div class=stat><label>Time</label><span>'+p.t+'s</span></div>'+
    '<div class=stat><label>Position</label><span>('+(p.x|0)+', '+(p.y|0)+', '+(p.z|0)+')</span></div>'+
    '<div class=stat><label>Heading</label><span>'+(p.heading*180/Math.PI|0)+'°</span></div>'+
    '<div class=stat><label>Control</label><span>x='+p.ctrl_x+' y='+p.ctrl_y+'</span></div>'+
    '<div class=stat><label>Frame</label><span>'+p.game_frame+'</span></div>';
  document.getElementById('slider').value=pos;
}
document.getElementById('slider').oninput=function(){pos=+this.value;render();};
document.getElementById('playBtn').onclick=function(){
  if(playing){playing=false;cancelAnimationFrame(animId);this.textContent='▶ Play';return;}
  playing=true;this.textContent='⏸ Pause';speed=+document.getElementById('speed').value;
  function step(){if(!playing||pos>=points.length-1){playing=false;document.getElementById('playBtn').textContent='▶ Play';return;}
    pos=Math.min(pos+speed,points.length-1);render();animId=requestAnimationFrame(step);}
  animId=requestAnimationFrame(step);
};
document.getElementById('resetBtn').onclick=function(){playing=false;cancelAnimationFrame(animId);document.getElementById('playBtn').textContent='▶ Play';pos=0;render();};
load();
</script></body></html>
